plugins { id 'com.android.application' }

android {
    namespace 'br.com.florestaviva.livewallpaper'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.florestaviva.livewallpaper'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.8.0-galaxia'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
