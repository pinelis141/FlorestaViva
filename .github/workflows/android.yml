name: Compilar APK Floresta Viva

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos do aplicativo
        run: |
          test -f settings.gradle || { echo 'Envie o conteudo da pasta android/ do ZIP ao repositorio'; exit 1; }
          test -f app/src/main/java/br/com/florestaviva/livewallpaper/ForestWallpaperService.java || { echo 'Arquivo Java principal ausente'; exit 1; }
          test -f app/src/main/res/drawable-nodpi/floresta.png || { echo 'Imagem da floresta ausente'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
