name: Floresta Viva - Qualidade e compilacao
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'qa/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas de arte
        run: python3 -m pip install --quiet opencv-python-headless pillow numpy
      - name: Gerar atlas a partir da arte original
        run: python3 tools/generate_replacement_atlases.py
      - name: Gerar quadros do fluxo galactico
        run: python3 tools/generate_galaxy_atlas.py
      - name: Validar Galaxia: fluxo, bordas e regressao
        run: python3 qa/verify_galaxy.py
      - name: Validar arte, movimento, interface e recursos
        run: python3 qa/verify_build.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Auditar Android e compilar APK
        run: cd android && gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Qualidade-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
